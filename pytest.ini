[pytest]
# ATENÇÃO — colisão de nomes conhecida.
# O pacote do projeto se chama `code/`, que é também o nome de um módulo da
# biblioteca padrão do Python. Quando `code/` entra no sys.path, `import code`
# resolve para o pacote do projeto e quebra tudo que depende do módulo padrão:
# pdb, e portanto o plugin de debugging do pytest, falham com
#   AttributeError: module 'code' has no attribute 'InteractiveConsole'
# Desabilitar o plugin contorna. A correção de fato é renomear o pacote (ex.:
# `src/` ou `giqbench/`), o que toca todos os imports e deve ser feito numa
# rodada própria, antes de o repositório virar público.
addopts = -p no:debugging -q
testpaths = tests
